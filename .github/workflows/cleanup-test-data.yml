# 一回限りの後片付け（テストデータの削除）。実行後にこのファイルとscripts/cleanupTestData.cjsは消す。
name: Cleanup test data (one-off)
on:
  push:
    branches:
      - claude/contract-request-flow-tm5i6r
    paths:
      - scripts/cleanupTestData.cjs
      - .github/workflows/cleanup-test-data.yml
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Cleanup
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALES_MANAGEMENT_STAGING }}
        run: node scripts/cleanupTestData.cjs
